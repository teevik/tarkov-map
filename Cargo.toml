[package]
name = "tarkov-map"
version = "0.1.12"
edition = "2024"
license = "MIT"
default-run = "tarkov-map"

[dependencies]
base64 = "0.23.1"
eframe = { version = "0.36.1", default-features = false, features = ["accesskit", "default_fonts", "glow", "links", "persistence", "wayland", "x11"] }
egui_extras = { version = "0.36.1", features = ["svg", "image"] }
ico = "0.5"
image = { version = "0.25.10", default-features = false, features = ["png"] }
env_logger = { version = "0.11.11", features = ["auto-color", "humantime"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
ron = "0.12.2"
rust-embed = { version = "8.12.0", features = ["compression"] }
indicatif = "0.18.6"
clap = { version = "4.6.3", features = ["derive"] }
resvg = "0.48.1"
log = "0.4.33"
thiserror = "2.0.20"
egui-toast = "0.22.0"
self_update = { version = "0.44.0", features = ["reqwest", "rustls"], default-features = false }
serde_with = "3.21.0"
notify = "8.0.0"
regex = "1.13"
dirs = "6.0"
open = "5.4"

[build-dependencies]

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
